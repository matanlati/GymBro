[project]
name = "mediapipenewversion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "ultralytics>=8.3.0",
    # Transitive requirements Ultralytics resolves lazily at runtime via
    # check_requirements(): shapely for solutions.BaseSolution, lap for the
    # BoTSORT tracker AIGym runs. Declared here so `uv sync` installs them up
    # front instead of pip-installing mid-request on a cold server.
    "shapely>=2.0.0",
    "lap>=0.5.12",
    "numpy>=2.4.1",
    "opencv-python>=4.13.0.90",
    "imageio-ffmpeg>=0.5.1",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.9",
    "torch>=2.13.0",
]
