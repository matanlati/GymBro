# BoT-SORT config for GymBro pose analysis, tuned to keep ONE lifter's track id
# stable through occlusion, brief exits and bystanders crossing the frame.
# Based on the stock ultralytics botsort.yaml; only the annotated lines differ.
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: botsort # (str) Tracker backend: botsort
track_high_thresh: 0.25 # (float) First-stage match threshold; raise for cleaner tracks, lower to keep more
track_low_thresh: 0.1 # (float) Second-stage threshold for low-score matches; balances recovery vs drift
new_track_thresh: 0.25 # (float) Start a new track if no match ≥ this; higher reduces false tracks
track_buffer: 60 # (int) CHANGED 30->60: keep the lifter's lost track alive ~2s @30fps through occlusion/exit
match_thresh: 0.8 # (float) Association similarity threshold (IoU/cost); tune with detector quality
fuse_score: True # (bool) Fuse detection score with motion/IoU for matching; stabilizes weak detections

# BoT-SORT specifics
gmc_method: sparseOptFlow # (str) Global motion compensation; helps the handheld/phone camera case

# ReID model related thresh
proximity_thresh: 0.5 # (float) Min IoU to consider tracks proximate for ReID; higher is stricter
appearance_thresh: 0.8 # (float) Min appearance similarity for ReID; higher avoids identity swaps
with_reid: True # (bool) CHANGED False->True: anchor the lifter's id to appearance, surviving crossings/exits
model: auto # (str) CHANGED: reuse the pose model's backbone features as the ReID embedding (no extra weights)
